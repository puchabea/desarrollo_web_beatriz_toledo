<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Agregar aviso adopción</title>
    <link rel="stylesheet" type="text/css" href="../css/agregar.css" />
  </head>

  <body>
    <h1>Formulario para agregar un aviso de adopción</h1>

    <div class="main-container">
      <div id="val-box" hidden>
        <h2 id="val-msg"></h2>
        <ul id="val-list"></ul>
      </div>

      <!-- Primera tabla -->
      <form name="myForm">
        <table>
          <tr>
            <th>¿Dónde?</th>
          </tr>
          <tr>
            <td><label for="select-region">Región</label></td>
            <td>
              <select name="select-region" id="select-region" required>
                <option value="">-- Selecciona una Región --</option>
              </select>
            </td>
          </tr>

          <tr>
            <td><label for="select-comuna">Comuna</label></td>
            <td>
              <select name="select-comuna" id="select-comuna" required>
                <option value="">-- Selecciona una Comuna --</option>
              </select>
            </td>
          </tr>

          <tr>
            <td>Sector</td>
            <td>
              <input type="text" name="Sector" id="Sector" maxlength="100" />
            </td>
          </tr>
        </table>

        <br />

        <!-- Segunda tabla -->
        <table>
          <tr>
            <th>Contacto de esta publicación</th>
          </tr>
          <tr>
            <td><label for="nombre">Nombre</label></td>
            <td>
              <input type="text" name="nombre" id="nombre"
                minlength="3" maxlength="200" required/>
            </td>
          </tr>

          <tr>
            <td>Email</td>
            <td>
              <input type="email" name="email" id="email" maxlength="100" />
            </td>
          </tr>

          <tr>
            <td>Número de celular</td>
            <td><input type="tel" name="phone" id="phone"/></td>
          </tr>

          <tr>
            <td>Contactar por</td>
            <td>
              <select name="contactar_por" id="contactar_por">
                <option value="">-- Selecciona una opción para contactar --</option>
                <option>Whatsapp</option>
                <option>Telegram</option>
                <option>X</option>
                <option>Instagram</option>
                <option>Tiktok</option>
                <option>Otra</option>
              </select>
              
            <label for="reason" style="display: none;">Información de contacto (ID / URL)</label>
            <textarea name="comments" id="comments" rows="4" cols="50" style="display: none;"></textarea><br>
            </td>
          </tr>
        </table>
        

        <br />

        <!-- Tercera tabla -->
        <table>
          <tr>
            <th>¿Qué mascota ofrece en adopción?</th>
          </tr>
          <tr>
            <td><label for="tipo">tipo</label></td>
            <td>
              <select name="tipo" id="tipo" required>
                <option value="">-- Selecciona un Gato o Perro --</option>
                <option>Gato</option>
                <option>Perro</option>
              </select>
            </td>
          </tr>

          <tr>
            <td>Cantidad</td>
            <td>
              <input type="number" name="cantidad" id="cantidad"
                minlength="1" required/>
            </td>
          </tr>

          <tr>
            <td>Edad</td>
            <td>
              <input type="number" name="edad" id="edad"
                minlength="1" required />
            </td>
          </tr>

          <tr>
            <td>Unidad medida edad</td>
            <td>
              <select name="uni_medida" id="uni_medida" required>
                <option value="">-- Selecciona una unidad de medida --</option>
                <option>Meses</option>
                <option>Años</option>
              </select>
            </td>
          </tr>

          <tr>
            <td>Fecha disponible para entrega</td>
            <td>
              <input type="datetime-local" name="fecha_dispo" id="fecha_dispo" required />
            </td>
          </tr>

          <tr>
            <td>Descripción</td>
            <td>
              <textarea rows="10" cols="50"></textarea>
            </td>
          </tr>

          <tr>
            <td>Foto</td>
            <td>
              <input type="file" name="files" id="files" required />
            </td>
          </tr>
        </table>

        <br />

        <button id="submit-btn" type="button">
          Agregar este aviso de adopción
        </button>
      </form>
    </div>

    <!-- Carga primero los datos, luego la lógica -->
    <script src="../js/region_comuna.js"></script>
    <script src="../js/agregar.js"></script>
  </body>
</html>
