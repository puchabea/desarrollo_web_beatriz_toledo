<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Agregar aviso adopción</title>
    <link rel="stylesheet" type="text/css" href="../css/agregar.css">
  </head>

  <body>
    <h1>Formulario para agregar un aviso de adopción</h1>

    <!-- Primera tabla -->
    <form>
      <table>
        <tr><th>¿Dónde?</th></tr>
        <tr>
          <td><label for="select-region">Región</label></td>
          <td>
            <select name="select-region" id="select-region" required>
              <option value="">-- Selecciona una Región --</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="select-comuna">Comuna</label></td>
          <td>
            <select name="select-comuna" id="select-comuna" required>
              <option value="">-- Selecciona una Comuna --</option>
            </select>
          </td>
        </tr>

        <tr>
          <td>Sector</td>
          <td><input type="text" name="Sector" id="Sector" maxlength="100"></td>
        </tr>
      </table>

      <br>

      <!-- Segunda tabla -->
      <table>
        <tr><th>Contacto de esta publicación</th></tr>
        <tr><td>Nombre</td><td><input type="text"></td></tr>
        <tr><td>Email</td><td><input type="email"></td></tr>
        <tr><td>Número de celular</td><td><input type="tel"></td></tr>
        <tr>
          <td>Contactar por</td>
          <td>
            <select>
              <option>Whatsapp</option>
              <option>Telegram</option>
              <option>X</option>
              <option>Instagram</option>
              <option>Tiktok</option>
              <option>Otra</option>
            </select>
          </td>
        </tr>
      </table>

      <br>

      <!-- Tercera tabla -->
      <table>
        <tr><th>¿Qué mascota ofrece en adopción?</th></tr>
        <tr>
          <td>Tipo</td>
          <td>
            <select>
              <option>Gato</option>
              <option>Perro</option>
            </select>
          </td>
        </tr>
        <tr><td>Cantidad</td><td><input type="number"></td></tr>
        <tr><td>Edad</td><td><input type="number"></td></tr>
        <tr>
          <td>Unidad medida edad</td>
          <td>
            <select>
              <option>Meses</option>
              <option>Años</option>
            </select>
          </td>
        </tr>
        <tr><td>Fecha disponible para entrega</td><td><input type="datetime-local"></td></tr>
        <tr><td>Descripción</td><td><textarea rows="10" cols="50"></textarea></td></tr>
        <tr><td>Foto</td><td><input type="file"></td></tr>
      </table>

      <br>
      <button type="button">Agregar este aviso de adopción</button>
    </form>

    <!-- Carga primero los datos, luego la lógica -->
    <script src="../js/region_comuna.js"></script>
    <script src="../js/agregar.js"></script>
  </body>
</html>
